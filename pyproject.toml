[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lunacorr"
version = "0.1.0"
description = "Physics-Informed Lunar Image Correspondence Pipeline"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Team R9@MedMitra", email = "research@luna-corr.org" }
]
keywords = ["planetary-science", "remote-sensing", "image-registration", "chandrayaan-2", "photoclinometry"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "opencv-python>=4.8.0",
    "pillow>=9.5.0",
    "requests>=2.28.0",
    "matplotlib>=3.7.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.0",
    "python-pptx>=0.6.21"
]

[project.scripts]
lunacorr = "lunacorr.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
